[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-math-jp"
version = "0.1.0"
description = "Shared Manim helpers for Japanese math explanation videos"
requires-python = ">=3.10"
dependencies = ["manim>=0.18"]

[tool.setuptools.packages.find]
include = ["manim_math*"]
